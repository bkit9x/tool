<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="tool-shell.css"></head><body data-tool-name="Data Generator" data-tool-category="Dữ liệu" data-tool-description="Tạo fake data, SQL INSERT và checksum SHA-256 cho file."><main class="shell tool-page"><section class="tool-intro" data-tool-intro></section><section class="tool-card"><label class="field-label" for="input">CSV hoặc JSON (dùng cho SQL)</label><textarea id="input" placeholder="name,email&#10;An,an@example.com"></textarea><div class="action-row"><button id="fake" class="button">Tạo fake data</button><button id="sql" class="button button-secondary">Tạo SQL INSERT</button><input id="file" type="file"><button id="hash" class="button button-secondary">SHA-256 file</button><button id="copy" class="button button-secondary">Sao chép</button></div><label class="field-label" for="output">Kết quả</label><textarea id="output" readonly></textarea><p id="status" class="status"></p></section></main><script src="tool-shell.js"></script><script>
const i=document.querySelector('#input'),o=document.querySelector('#output'),s=document.querySelector('#status'),f=document.querySelector('#file');const first=['An','Bình','Châu','Dũng','Hà','Linh','Minh','Ngọc'],last=['Nguyễn','Trần','Lê','Phạm','Hoàng'];document.querySelector('#fake').onclick=()=>{o.value=Array.from({length:10},(_,n)=>{const a=first[n%first.length],b=last[n%last.length];return `${b} ${a},${a.toLowerCase()}${n+1}@example.com,09${String(10000000+n).slice(-8)}`}).join('\n');s.textContent='Đã tạo 10 dòng fake data.'};document.querySelector('#sql').onclick=()=>{const r=i.value.trim().split(/\r?\n/).map(x=>x.split(',').map(y=>y.trim())),[h,...d]=r;if(!h?.length)return;const q=v=>"'"+v.replaceAll("'","''")+"'";o.value=d.map(x=>`INSERT INTO table_name (${h.join(', ')}) VALUES (${x.map(q).join(', ')});`).join('\n');s.textContent='Đã tạo SQL INSERT.'};document.querySelector('#hash').onclick=async()=>{const z=f.files[0];if(!z)return;const d=await crypto.subtle.digest('SHA-256',await z.arrayBuffer());o.value=[...new Uint8Array(d)].map(x=>x.toString(16).padStart(2,'0')).join('');s.textContent='Đã tính SHA-256.'};document.querySelector('#copy').onclick=()=>navigator.clipboard.writeText(o.value).then(()=>s.textContent='Đã sao chép.');
</script></body></html>

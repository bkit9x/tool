<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="tool-shell.css">
  <style>
    .sort-controls { display: grid; grid-template-columns: minmax(0, 1fr) minmax(210px, .8fr); gap: 16px; margin-top: 20px; }
    .control-field { min-width: 0; }
    .control-field select { width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 13px 40px 13px 14px; outline: none; color: var(--text); background: var(--input); }
    .control-field select:focus { border-color: var(--mint); box-shadow: 0 0 0 3px color-mix(in srgb, var(--mint) 16%, transparent); }
    .field-help { margin: 7px 0 0; color: var(--muted); font-size: .8rem; line-height: 1.45; }
    .field-help code { color: var(--mint); font-family: Consolas, monospace; }
    .result-heading { display: flex; align-items: end; justify-content: space-between; gap: 16px; margin-top: 26px; }
    .result-heading .field-label { margin-bottom: 9px; }
    .item-count { margin-bottom: 9px; color: var(--muted); font-family: Consolas, monospace; font-size: .78rem; }
    @media (max-width: 680px) { .sort-controls { grid-template-columns: 1fr; } }
  </style>
</head>
<body data-tool-name="Alphabet Sorter" data-tool-category="Văn bản" data-tool-description="Tách văn bản theo ký tự tùy chọn, làm sạch khoảng trắng, sắp xếp rồi nối lại theo định dạng ban đầu.">
  <main class="shell tool-page">
    <section class="tool-intro" data-tool-intro></section>
    <section class="tool-card">
      <label class="field-label" for="sourceText">Văn bản cần sắp xếp</label>
      <textarea id="sourceText" placeholder="Cam, Táo, Chuối, Dâu"></textarea>

      <div class="sort-controls">
        <div class="control-field">
          <label class="field-label" for="separator">Ký tự phân cách</label>
          <input id="separator" type="text" value="," autocomplete="off" spellcheck="false">
          <p class="field-help">Có thể dùng ký tự thường hoặc mã <code>\n</code> (xuống dòng), <code>\t</code> (tab), <code>\s</code> (khoảng trắng).</p>
        </div>
        <div class="control-field">
          <label class="field-label" for="sortMode">Cách sắp xếp</label>
          <select id="sortMode">
            <option value="alphabet-asc">Chữ cái: A → Z</option>
            <option value="alphabet-desc">Chữ cái: Z → A</option>
            <option value="number-asc">Số: nhỏ → lớn</option>
            <option value="number-desc">Số: lớn → nhỏ</option>
          </select>
        </div>
      </div>

      <div class="action-row">
        <button id="sortButton" class="button" type="button">Sắp xếp</button>
        <button id="clearButton" class="button button-secondary" type="button">Xóa</button>
      </div>
      <p id="status" class="status" role="status">Khoảng trắng ở đầu và cuối mỗi phần tử sẽ được loại bỏ trước khi sắp xếp.</p>

      <div class="result-heading">
        <label class="field-label" for="resultText">Kết quả</label>
        <span id="itemCount" class="item-count"></span>
      </div>
      <textarea id="resultText" readonly placeholder="Kết quả sau khi sắp xếp sẽ xuất hiện ở đây."></textarea>
      <div class="action-row"><button id="copyButton" class="button" type="button" disabled>Sao chép kết quả</button></div>
    </section>
  </main>
  <script src="tool-shell.js"></script>
  <script>
    const sourceText = document.getElementById('sourceText');
    const separatorInput = document.getElementById('separator');
    const sortMode = document.getElementById('sortMode');
    const resultText = document.getElementById('resultText');
    const status = document.getElementById('status');
    const itemCount = document.getElementById('itemCount');
    const copyButton = document.getElementById('copyButton');

    function decodeSeparator(value) {
      return value.replace(/\\n/g, '\n').replace(/\\r/g, '\r').replace(/\\t/g, '\t').replace(/\\s/g, ' ');
    }

    function compareAlphabet(left, right) {
      return left.localeCompare(right, 'vi', { sensitivity: 'base', numeric: true });
    }

    function compareNumber(left, right) {
      const leftNumber = Number(left.replace(',', '.'));
      const rightNumber = Number(right.replace(',', '.'));
      const leftValid = Number.isFinite(leftNumber);
      const rightValid = Number.isFinite(rightNumber);
      if (leftValid && rightValid) return leftNumber - rightNumber;
      if (leftValid !== rightValid) return leftValid ? -1 : 1;
      return compareAlphabet(left, right);
    }

    function sortItems() {
      const separator = decodeSeparator(separatorInput.value);
      if (!sourceText.value) {
        status.textContent = 'Hãy nhập văn bản cần sắp xếp.';
        sourceText.focus();
        return;
      }
      if (!separator) {
        status.textContent = 'Ký tự phân cách không được để trống.';
        separatorInput.focus();
        return;
      }

      const items = sourceText.value.split(separator).map(item => item.trim());
      const descending = sortMode.value.endsWith('desc');
      const compare = sortMode.value.startsWith('number') ? compareNumber : compareAlphabet;
      items.sort((left, right) => descending ? compare(right, left) : compare(left, right));

      resultText.value = items.join(separator);
      itemCount.textContent = `${items.length} phần tử`;
      copyButton.disabled = false;
      status.textContent = 'Đã bỏ khoảng trắng, sắp xếp và nối lại bằng ký tự phân cách đã nhập.';
    }

    async function copyResult() {
      if (!resultText.value) return;
      try {
        await navigator.clipboard.writeText(resultText.value);
        status.textContent = 'Đã sao chép kết quả.';
      } catch {
        resultText.focus();
        resultText.select();
        status.textContent = 'Hãy nhấn Ctrl/Cmd + C để sao chép.';
      }
    }

    function clearAll() {
      sourceText.value = '';
      resultText.value = '';
      itemCount.textContent = '';
      copyButton.disabled = true;
      status.textContent = 'Khoảng trắng ở đầu và cuối mỗi phần tử sẽ được loại bỏ trước khi sắp xếp.';
      sourceText.focus();
    }

    document.getElementById('sortButton').addEventListener('click', sortItems);
    document.getElementById('clearButton').addEventListener('click', clearAll);
    copyButton.addEventListener('click', copyResult);
    sourceText.addEventListener('keydown', event => {
      if ((event.ctrlKey || event.metaKey) && event.key === 'Enter') sortItems();
    });
  </script>
</body>
</html>

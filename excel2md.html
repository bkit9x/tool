<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="tool-shell.css">
</head>
<body data-tool-name="Excel to Markdown" data-tool-category="Dữ liệu" data-tool-description="Chuyển dữ liệu bảng được dán từ Excel thành bảng Markdown.">
  <main class="shell tool-page">
    <section class="tool-intro" data-tool-intro></section>
    <section class="tool-card">
      <div class="split-grid">
        <div><label class="field-label" for="excelInput">Dữ liệu từ Excel</label><textarea id="excelInput" placeholder="Dán bảng Excel vào đây..."></textarea></div>
        <div><label class="field-label" for="markdownOutput">Markdown</label><textarea id="markdownOutput" readonly placeholder="Bảng Markdown sẽ xuất hiện ở đây."></textarea></div>
      </div>
      <div class="option-row">
        <label><input id="firstRowHeader" type="checkbox" checked> Dòng đầu là tiêu đề</label>
        <label><input id="trimCells" type="checkbox" checked> Bỏ khoảng trắng thừa</label>
        <label><input id="emptyAsDash" type="checkbox"> Ô trống thành dấu gạch ngang</label>
      </div>
      <div class="action-row"><button id="convertButton" class="button" type="button">Chuyển đổi</button><button id="copyButton" class="button button-secondary" type="button">Sao chép Markdown</button><button id="clearButton" class="button button-secondary" type="button">Xóa</button></div>
      <p id="status" class="status" role="status"></p>
      <label class="field-label">Xem trước</label><div id="preview" class="preview">Chưa có dữ liệu.</div>
    </section>
  </main>
  <script src="tool-shell.js"></script>
  <script>
    const excelInput = document.getElementById('excelInput');
    const markdownOutput = document.getElementById('markdownOutput');
    const firstRowHeader = document.getElementById('firstRowHeader');
    const trimCells = document.getElementById('trimCells');
    const emptyAsDash = document.getElementById('emptyAsDash');
    const preview = document.getElementById('preview');
    const status = document.getElementById('status');

    function normalizeCell(value) {
      const cell = trimCells.checked ? value.trim() : value;
      return emptyAsDash.checked && !cell ? '-' : cell;
    }

    // Excel exports tab-delimited data and quotes fields that contain newlines.
    function parseExcel(text) {
      const source = text.replace(/\r\n?|\n/g, '\n');
      const rows = []; let row = []; let cell = ''; let quoted = false;
      for (let index = 0; index < source.length; index += 1) {
        const character = source[index];
        if (character === '"') {
          if (quoted && source[index + 1] === '"') { cell += '"'; index += 1; } else quoted = !quoted;
        } else if (character === '\t' && !quoted) { row.push(normalizeCell(cell)); cell = ''; }
        else if (character === '\n' && !quoted) { row.push(normalizeCell(cell)); rows.push(row); row = []; cell = ''; }
        else cell += character;
      }
      if (cell || row.length) { row.push(normalizeCell(cell)); rows.push(row); }
      return rows.filter(currentRow => currentRow.some(value => value !== ''));
    }

    function padRows(rows) {
      const columns = Math.max(...rows.map(row => row.length));
      return rows.map(row => [...row, ...Array(columns - row.length).fill(emptyAsDash.checked ? '-' : '')]);
    }

    function escapeMarkdown(value) { return value.replaceAll('|', '\\|').replace(/\r?\n/g, '<br>'); }
    function escapeHtml(value) { const node = document.createElement('span'); node.textContent = value; return node.innerHTML; }

    function convert() {
      const parsed = parseExcel(excelInput.value);
      if (!parsed.length) { markdownOutput.value = ''; preview.textContent = 'Chưa có dữ liệu.'; return; }
      const rows = padRows(parsed);
      const header = firstRowHeader.checked ? rows[0] : rows[0].map((_, index) => `Cột ${index + 1}`);
      const body = firstRowHeader.checked ? rows.slice(1) : rows;
      const markdownLine = cells => `| ${cells.map(escapeMarkdown).join(' | ')} |`;
      markdownOutput.value = [markdownLine(header), markdownLine(header.map(() => '---')), ...body.map(markdownLine)].join('\n');
      preview.innerHTML = `<table><thead><tr>${header.map(cell => `<th>${escapeHtml(cell)}</th>`).join('')}</tr></thead><tbody>${body.map(row => `<tr>${row.map(cell => `<td>${escapeHtml(cell)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
    }

    async function copyMarkdown() {
      convert();
      if (!markdownOutput.value) return;
      try { await navigator.clipboard.writeText(markdownOutput.value); status.textContent = 'Đã sao chép Markdown.'; }
      catch { markdownOutput.focus(); markdownOutput.select(); status.textContent = 'Hãy nhấn Ctrl/Cmd + C để sao chép.'; }
    }

    function clearAll() { excelInput.value = ''; markdownOutput.value = ''; preview.textContent = 'Chưa có dữ liệu.'; status.textContent = ''; excelInput.focus(); }
    [excelInput, firstRowHeader, trimCells, emptyAsDash].forEach(element => element.addEventListener(element === excelInput ? 'input' : 'change', convert));
    document.getElementById('convertButton').addEventListener('click', convert);
    document.getElementById('copyButton').addEventListener('click', copyMarkdown);
    document.getElementById('clearButton').addEventListener('click', clearAll);
  </script>
</body>
</html>

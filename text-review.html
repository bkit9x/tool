<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="tool-shell.css"></head><body data-tool-name="Text Review" data-tool-category="Văn bản" data-tool-description="So sánh văn bản và xem trước Markdown sang HTML."><main class="shell tool-page"><section class="tool-intro" data-tool-intro></section><section class="tool-card"><div class="split-grid"><div><label class="field-label" for="left">Văn bản / Markdown</label><textarea id="left"></textarea></div><div><label class="field-label" for="right">Văn bản để so sánh</label><textarea id="right"></textarea></div></div><div class="action-row"><button id="diff" class="button">So sánh</button><button id="markdown" class="button button-secondary">Markdown preview</button></div><p id="status" class="status"></p><div id="preview" class="preview"></div></section></main><script src="tool-shell.js"></script><script>
const l=document.querySelector('#left'),r=document.querySelector('#right'),p=document.querySelector('#preview'),s=document.querySelector('#status');const esc=v=>v.replace(/[&<>]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[x]));document.querySelector('#diff').onclick=()=>{const a=l.value.split('\n'),b=r.value.split('\n'),n=Math.max(a.length,b.length);p.innerHTML='<pre>'+Array.from({length:n},(_,i)=>a[i]===b[i]?'  '+esc(a[i]||''):'- '+esc(a[i]||'')+'\n+ '+esc(b[i]||'')).join('\n')+'</pre>';s.textContent='Đã so sánh từng dòng.'};document.querySelector('#markdown').onclick=()=>{p.innerHTML=l.value.split('\n').map(x=>x.replace(/^### (.*)/,'<h3>$1</h3>').replace(/^## (.*)/,'<h2>$1</h2>').replace(/^# (.*)/,'<h1>$1</h1>').replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/`(.*?)`/g,'<code>$1</code>')).join('<br>');s.textContent='Đã xem trước Markdown cơ bản.'};
</script></body></html>

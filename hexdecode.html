<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="tool-shell.css">
</head>
<body data-tool-name="HTML Entity Decoder" data-tool-category="Văn bản" data-tool-description="Giải mã HTML entity thành văn bản tiếng Việt dễ đọc.">
  <main class="shell tool-page">
    <section class="tool-intro" data-tool-intro></section>
    <section class="tool-card">
      <label class="field-label" for="input">Chuỗi đã mã hóa</label>
      <textarea id="input" placeholder="Ví dụ: Ch&#7885;n / b&#7887; t&#7845;t c&#7843; kết quả"></textarea>
      <div class="action-row"><button id="decodeButton" class="button" type="button">Giải mã</button><button id="copyButton" class="button button-secondary" type="button">Sao chép kết quả</button></div>
      <p id="status" class="status" role="status"></p>
      <label class="field-label" for="output">Kết quả</label>
      <textarea id="output" readonly placeholder="Kết quả sẽ xuất hiện ở đây."></textarea>
    </section>
  </main>
  <script src="tool-shell.js"></script>
  <script>
    const input = document.getElementById('input');
    const output = document.getElementById('output');
    const status = document.getElementById('status');

    function decodeEntities(value) {
      const decoder = document.createElement('textarea');
      decoder.innerHTML = value;
      return decoder.value;
    }

    function decodeText() {
      output.value = decodeEntities(input.value);
      status.textContent = input.value ? 'Đã giải mã nội dung.' : '';
    }

    async function copyResult() {
      if (!output.value) return;
      try {
        await navigator.clipboard.writeText(output.value);
        status.textContent = 'Đã sao chép kết quả.';
      } catch {
        output.focus();
        output.select();
        status.textContent = 'Hãy nhấn Ctrl/Cmd + C để sao chép.';
      }
    }

    input.addEventListener('input', decodeText);
    document.getElementById('decodeButton').addEventListener('click', decodeText);
    document.getElementById('copyButton').addEventListener('click', copyResult);
  </script>
</body>
</html>

<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DevTools Mini</title>
  <link rel="stylesheet" href="tool-shell.css">
  <style>
    .home { padding: 42px 0 74px; }
    .catalogue-bar { display: flex; align-items: center; justify-content: space-between; gap: 18px; margin-bottom: 20px; }
    .catalogue h1 { margin: 0; font-size: clamp(1.8rem, 4vw, 2.6rem); letter-spacing: -.055em; }
    .catalogue h1 span { color: var(--mint); font-family: Consolas, monospace; font-size: .78rem; font-weight: normal; letter-spacing: 0; vertical-align: middle; }
    .search-wrap { position: relative; width: min(100%, 365px); }
    .search-wrap input { padding-left: 41px; }
    .search-wrap span { position: absolute; top: 50%; left: 14px; transform: translateY(-50%); color: var(--mint); font-family: Consolas, monospace; }
    .filter-list { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
    .filter { padding: 7px 11px; border: 1px solid var(--line); border-radius: 99px; background: var(--surface); color: var(--muted); font-size: .8rem; }
    .filter[aria-pressed="true"] { border-color: var(--mint); background: var(--mint); color: var(--mint-ink); font-weight: bold; }
    .tool-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(235px, 1fr)); gap: 14px; }
    .tool-card-link { min-height: 228px; padding: 20px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); color: inherit; text-decoration: none; transition: transform .18s, border-color .18s, background .18s; animation: rise .35s both; }
    .tool-card-link:hover { border-color: var(--mint); background: var(--surface-raised); transform: translateY(-4px); }
    .tool-icon { display: grid; width: 40px; height: 40px; place-items: center; border: 1px solid color-mix(in srgb, var(--mint) 60%, transparent); border-radius: 10px; color: var(--mint); font-family: Consolas, monospace; font-size: .86rem; }
    .tool-category { display: block; margin-top: 24px; color: var(--orange); font-family: Consolas, monospace; font-size: .73rem; text-transform: uppercase; }
    .tool-card-link h2 { margin: 6px 0 8px; font-size: 1.1rem; letter-spacing: -.03em; }
    .tool-card-link p { margin: 0; color: var(--muted); font-size: .9rem; line-height: 1.45; }
    .empty { grid-column: 1 / -1; padding: 34px; border: 1px dashed var(--line); border-radius: 14px; color: var(--muted); text-align: center; }
    @keyframes rise { from { opacity: 0; transform: translateY(9px); } to { opacity: 1; transform: translateY(0); } }
    @media (max-width: 680px) { .home { padding-top: 30px; } .catalogue-bar { display: block; } .catalogue h1 { margin-bottom: 14px; } .search-wrap { width: 100%; } }
  </style>
</head>
<body>
  <header class="site-header"><div class="shell"><a class="brand" href="index.html"><span class="brand-mark">&gt;_</span><span>DevTools Mini</span></a><div class="header-actions"><button class="theme-toggle" type="button" data-theme-toggle></button><span class="eyebrow">Bộ công cụ</span></div></div></header>
  <main class="shell home">
    <section class="catalogue" aria-labelledby="catalogue-title">
      <div class="catalogue-bar"><h1 id="catalogue-title">Danh mục công cụ <span id="toolCount"></span></h1><label class="search-wrap"><span>/</span><input id="searchInput" type="search" placeholder="Tìm theo tên, mô tả, từ khóa..." autocomplete="off"></label></div>
      <div id="filters" class="filter-list" aria-label="Lọc theo nhóm"></div>
      <div id="toolGrid" class="tool-grid" aria-live="polite"><div class="empty">Đang tải danh mục...</div></div>
    </section>
  </main>
  <script src="tool-shell.js"></script>
  <script>
    const toolGrid = document.getElementById('toolGrid');
    const toolCount = document.getElementById('toolCount');
    const searchInput = document.getElementById('searchInput');
    const filters = document.getElementById('filters');
    let tools = [];
    let activeCategory = 'Tất cả';

    function iconFor(name) {
      return { shield_lock: '2FA', table_chart: 'tbl', code: '&lt;/&gt;', image: 'img', regex: '.*', text: 'Aa', codec: '&lt;&gt;', qr: 'QR', name: 'N@', phone: 'tel', data: '{}', security: 'key', time: '24h', media: 'img', diff: '+/-', generate: 'gen' }[name] || '&gt;_';
    }

    function renderFilters() {
      const categories = ['Tất cả', ...new Set(tools.map(tool => tool.category))];
      filters.innerHTML = categories.map(category => `<button class="filter" type="button" data-category="${category}" aria-pressed="${category === activeCategory}">${category}</button>`).join('');
    }

    function renderTools() {
      const query = searchInput.value.trim().toLocaleLowerCase('vi');
      const visibleTools = tools.filter(tool => {
        const content = [tool.name, tool.description, tool.category, ...(tool.keywords || [])].join(' ').toLocaleLowerCase('vi');
        return (activeCategory === 'Tất cả' || tool.category === activeCategory) && content.includes(query);
      });
      toolCount.textContent = `(${visibleTools.length})`;
      toolGrid.innerHTML = visibleTools.length ? visibleTools.map((tool, index) => `
        <a class="tool-card-link" href="${tool.path}" style="animation-delay:${index * 55}ms">
          <span class="tool-icon">${iconFor(tool.icon)}</span><span class="tool-category">${tool.category}</span>
          <h2>${tool.name}</h2><p>${tool.description}</p>
        </a>`).join('') : '<div class="empty">Không tìm thấy công cụ phù hợp.</div>';
    }

    filters.addEventListener('click', event => {
      const button = event.target.closest('[data-category]');
      if (!button) return;
      activeCategory = button.dataset.category;
      renderFilters();
      renderTools();
    });
    searchInput.addEventListener('input', renderTools);

    fetch('tools.json')
      .then(response => response.ok ? response.json() : Promise.reject(new Error('Không tải được danh mục')))
      .then(data => { tools = data; renderFilters(); renderTools(); })
      .catch(() => { toolGrid.innerHTML = '<div class="empty">Không thể tải tools.json. Hãy mở trang bằng web server cục bộ.</div>'; });
  </script>
</body>
</html>

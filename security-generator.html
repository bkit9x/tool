<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="tool-shell.css"></head><body data-tool-name="Security Generator" data-tool-category="Bảo mật" data-tool-description="JWT decoder, UUID, hash SHA và password generator."><main class="shell tool-page"><section class="tool-intro" data-tool-intro></section><section class="tool-card"><div class="split-grid"><div><label class="field-label" for="input">Nội dung / JWT</label><textarea id="input"></textarea></div><div><label class="field-label" for="output">Kết quả</label><textarea id="output" readonly></textarea></div></div><div class="action-row"><button class="button" data-a="jwt">Decode JWT</button><button class="button button-secondary" data-a="uuid">Tạo UUID</button><button class="button button-secondary" data-a="pass">Tạo password</button><button class="button button-secondary" data-a="sha1">SHA-1</button><button class="button button-secondary" data-a="sha256">SHA-256</button><button id="copy" class="button button-secondary">Sao chép</button></div><p id="status" class="status"></p></section></main><script src="tool-shell.js"></script><script>
const i=document.querySelector('#input'),o=document.querySelector('#output'),s=document.querySelector('#status');const chars='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$%';
const b64=v=>new TextDecoder().decode(Uint8Array.from(atob(v.replace(/-/g,'+').replace(/_/g,'/')+'='.repeat((4-v.length%4)%4)),x=>x.charCodeAt(0)));
async function run(a){try{if(a==='jwt'){const p=i.value.split('.');if(p.length<2)throw Error('JWT cần ít nhất 2 phần.');o.value=JSON.stringify({header:JSON.parse(b64(p[0])),payload:JSON.parse(b64(p[1]))},null,2)}if(a==='uuid')o.value=crypto.randomUUID();if(a==='pass')o.value=Array.from(crypto.getRandomValues(new Uint32Array(18)),x=>chars[x%chars.length]).join('');if(a.startsWith('sha')){const d=await crypto.subtle.digest(a.toUpperCase().replace('SHA','SHA-'),new TextEncoder().encode(i.value));o.value=[...new Uint8Array(d)].map(x=>x.toString(16).padStart(2,'0')).join('')}s.textContent='Đã tạo kết quả.'}catch(e){s.textContent=e.message}}
document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>run(b.dataset.a));document.querySelector('#copy').onclick=async()=>{try{await navigator.clipboard.writeText(o.value);s.textContent='Đã sao chép.'}catch{}};
</script></body></html>

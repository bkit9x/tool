<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="tool-shell.css">
  <style>.otp-code { margin: 22px 0 5px; color: var(--mint); font-family: Consolas, monospace; font-size: clamp(2.7rem, 10vw, 5.3rem); font-weight: bold; letter-spacing: .08em; line-height: 1; } .countdown { color: var(--muted); font-size: .9rem; }</style>
</head>
<body data-tool-name="TOTP / 2FA Generator" data-tool-category="Bảo mật" data-tool-description="Tạo mã xác thực hai lớp từ secret Base32 hoặc liên kết otpauth.">
  <main class="shell tool-page">
    <section class="tool-intro" data-tool-intro></section>
    <section class="tool-card">
      <label class="field-label" for="secretInput">Secret hoặc liên kết otpauth</label>
      <input id="secretInput" type="text" autocomplete="off" spellcheck="false" placeholder="JBSWY3DPEHPK3PXP hoặc otpauth://totp/...">
      <div id="code" class="otp-code">------</div>
      <div class="action-row"><button id="copyButton" class="button button-secondary" type="button" disabled>Sao chép mã</button></div>
      <div class="countdown">Mã mới sau <strong id="remain">--</strong> giây</div>
      <div class="meta-grid">
        <div class="meta-item">Nhà phát hành<strong id="issuer">-</strong></div><div class="meta-item">Tài khoản<strong id="account">-</strong></div>
        <div class="meta-item">Thuật toán<strong id="algorithm">-</strong></div><div class="meta-item">Số chữ số / chu kỳ<strong id="details">-</strong></div>
      </div>
      <p id="status" class="status" role="status"></p>
    </section>
  </main>
  <script src="tool-shell.js"></script>
  <script>
    const input = document.getElementById('secretInput');
    const codeElement = document.getElementById('code');
    const remainElement = document.getElementById('remain');
    const status = document.getElementById('status');
    const copyButton = document.getElementById('copyButton');

    function normalizeAlgorithm(value) {
      const algorithm = value.toUpperCase().replace('-', '');
      return ['SHA1', 'SHA256', 'SHA512'].includes(algorithm) ? algorithm.replace('SHA', 'SHA-') : 'SHA-1';
    }

    function parseInput(value) {
      const config = { secret: value.trim(), issuer: '', account: '', algorithm: 'SHA-1', digits: 6, period: 30 };
      if (config.secret.toLowerCase().startsWith('otpauth://')) {
        const url = new URL(config.secret);
        const label = decodeURIComponent(url.pathname.replace(/^\/+/, ''));
        const [labelIssuer, ...accountParts] = label.split(':');
        config.secret = url.searchParams.get('secret') || '';
        config.issuer = url.searchParams.get('issuer') || (accountParts.length ? labelIssuer : '');
        config.account = accountParts.length ? accountParts.join(':') : label;
        config.algorithm = normalizeAlgorithm(url.searchParams.get('algorithm') || 'SHA-1');
        config.digits = Number(url.searchParams.get('digits') || 6);
        config.period = Number(url.searchParams.get('period') || 30);
      }
      config.secret = config.secret.replace(/\s+/g, '').toUpperCase();
      if (!Number.isInteger(config.digits) || config.digits < 6 || config.digits > 10 || !Number.isInteger(config.period) || config.period < 1) throw new Error('Cấu hình TOTP không hợp lệ.');
      return config;
    }

    function decodeBase32(secret) {
      const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
      const clean = secret.replace(/=+$/g, '');
      let bits = '';
      for (const character of clean) {
        const position = alphabet.indexOf(character);
        if (position < 0) throw new Error('Secret Base32 không hợp lệ.');
        bits += position.toString(2).padStart(5, '0');
      }
      const bytes = [];
      for (let offset = 0; offset + 8 <= bits.length; offset += 8) bytes.push(parseInt(bits.slice(offset, offset + 8), 2));
      return new Uint8Array(bytes);
    }

    async function generateCode(config) {
      const counter = Math.floor(Date.now() / 1000 / config.period);
      const buffer = new ArrayBuffer(8);
      const view = new DataView(buffer);
      view.setUint32(0, Math.floor(counter / 0x100000000), false);
      view.setUint32(4, counter >>> 0, false);
      const key = await crypto.subtle.importKey('raw', decodeBase32(config.secret), { name: 'HMAC', hash: config.algorithm }, false, ['sign']);
      const digest = new Uint8Array(await crypto.subtle.sign('HMAC', key, buffer));
      const offset = digest[digest.length - 1] & 0x0f;
      const number = ((digest[offset] & 0x7f) << 24) | ((digest[offset + 1] & 0xff) << 16) | ((digest[offset + 2] & 0xff) << 8) | (digest[offset + 3] & 0xff);
      return String(number % (10 ** config.digits)).padStart(config.digits, '0');
    }

    function renderMeta(config) {
      document.getElementById('issuer').textContent = config.issuer || '-';
      document.getElementById('account').textContent = config.account || '-';
      document.getElementById('algorithm').textContent = config.algorithm;
      document.getElementById('details').textContent = `${config.digits} số / ${config.period}s`;
    }

    async function update() {
      if (!input.value.trim()) {
        codeElement.textContent = '------'; remainElement.textContent = '--'; status.textContent = '';
        copyButton.disabled = true;
        renderMeta({ issuer: '-', account: '-', algorithm: '-', digits: '-', period: '-' });
        return;
      }
      try {
        const config = parseInput(input.value);
        renderMeta(config);
        remainElement.textContent = config.period - (Math.floor(Date.now() / 1000) % config.period);
        codeElement.textContent = await generateCode(config);
        copyButton.disabled = false;
        status.textContent = '';
      } catch (error) {
        codeElement.textContent = 'Lỗi'; copyButton.disabled = true; status.textContent = error.message;
      }
    }

    async function copyCode() {
      const code = codeElement.textContent;
      if (copyButton.disabled || !/^\d+$/.test(code)) return;
      try {
        await navigator.clipboard.writeText(code);
        status.textContent = 'Đã sao chép mã xác thực.';
      } catch {
        status.textContent = 'Không thể sao chép mã. Hãy thử lại trên HTTPS hoặc localhost.';
      }
    }

    input.addEventListener('input', update);
    copyButton.addEventListener('click', copyCode);
    setInterval(update, 1000);
    update();
  </script>
</body>
</html>

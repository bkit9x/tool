<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <title>TOTP Generator</title>
  <style>
    body { font-family: system-ui; max-width: 560px; margin: 40px auto; }
    input { width: 100%; padding: 10px; font-size: 16px; }
    #code { font-size: 42px; font-weight: bold; margin-top: 20px; }
    .meta { color: #555; margin-top: 8px; }
  </style>
</head>
<body>
  <h2>TOTP / 2FA Generator</h2>

  <input id="secretInput" placeholder="Nhập secret hoặc otpauth://..." />

  <div id="code">------</div>
  <div>Còn lại: <span id="remain">--</span>s</div>

  <div class="meta">
    <div>Issuer: <span id="issuer">-</span></div>
    <div>Account: <span id="account">-</span></div>
    <div>Algorithm: <span id="algo">-</span></div>
    <div>Digits: <span id="digits">-</span></div>
    <div>Period: <span id="period">-</span></div>
  </div>

  <script>
    const input = document.getElementById("secretInput");
    const codeEl = document.getElementById("code");
    const remainEl = document.getElementById("remain");

    const issuerEl = document.getElementById("issuer");
    const accountEl = document.getElementById("account");
    const algoEl = document.getElementById("algo");
    const digitsEl = document.getElementById("digits");
    const periodEl = document.getElementById("period");

    function parseOtpInput(value) {
      value = value.trim();

      const config = {
        secret: value,
        issuer: "",
        account: "",
        algorithm: "SHA-1",
        digits: 6,
        period: 30
      };

      if (value.toLowerCase().startsWith("otpauth://")) {
        const url = new URL(value);

        const params = url.searchParams;
        config.secret = params.get("secret") || "";
        config.algorithm = normalizeAlgorithm(params.get("algorithm") || "SHA1");
        config.digits = Number(params.get("digits") || 6);
        config.period = Number(params.get("period") || 30);
        config.issuer = params.get("issuer") || "";

        const label = decodeURIComponent(url.pathname.replace(/^\/+/, ""));
        const parts = label.split(":");

        if (!config.issuer && parts.length > 1) {
          config.issuer = parts[0];
        }

        config.account = parts.length > 1 ? parts.slice(1).join(":") : label;
      } else {
        config.algorithm = "SHA-1";
      }

      config.secret = config.secret.replace(/\s+/g, "").toUpperCase();

      return config;
    }

    function normalizeAlgorithm(algo) {
      const value = algo.toUpperCase().replace("-", "");

      if (value === "SHA1") return "SHA-1";
      if (value === "SHA256") return "SHA-256";
      if (value === "SHA512") return "SHA-512";

      return "SHA-1";
    }

    function base32Decode(base32) {
      const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ234567";
      const clean = base32.replace(/=+$/g, "").replace(/\s+/g, "").toUpperCase();

      let bits = "";
      for (const char of clean) {
        const val = alphabet.indexOf(char);
        if (val === -1) throw new Error("Secret không hợp lệ");
        bits += val.toString(2).padStart(5, "0");
      }

      const bytes = [];
      for (let i = 0; i + 8 <= bits.length; i += 8) {
        bytes.push(parseInt(bits.slice(i, i + 8), 2));
      }

      return new Uint8Array(bytes);
    }

    async function generateTOTP(config) {
      const keyBytes = base32Decode(config.secret);
      const counter = Math.floor(Date.now() / 1000 / config.period);

      const buffer = new ArrayBuffer(8);
      const view = new DataView(buffer);

      const high = Math.floor(counter / 0x100000000);
      const low = counter >>> 0;

      view.setUint32(0, high, false);
      view.setUint32(4, low, false);

      const key = await crypto.subtle.importKey(
        "raw",
        keyBytes,
        { name: "HMAC", hash: config.algorithm },
        false,
        ["sign"]
      );

      const hmac = new Uint8Array(await crypto.subtle.sign("HMAC", key, buffer));
      const offset = hmac[hmac.length - 1] & 0xf;

      const binary =
        ((hmac[offset] & 0x7f) << 24) |
        ((hmac[offset + 1] & 0xff) << 16) |
        ((hmac[offset + 2] & 0xff) << 8) |
        (hmac[offset + 3] & 0xff);

      return String(binary % 10 ** config.digits).padStart(config.digits, "0");
    }

    function updateMeta(config) {
      issuerEl.textContent = config.issuer || "-";
      accountEl.textContent = config.account || "-";
      algoEl.textContent = config.algorithm;
      digitsEl.textContent = config.digits;
      periodEl.textContent = config.period;
    }

    async function update() {
      const raw = input.value.trim();

      if (!raw) {
        codeEl.textContent = "------";
        remainEl.textContent = "--";
        updateMeta({
          issuer: "",
          account: "",
          algorithm: "-",
          digits: "-",
          period: "-"
        });
        return;
      }

      try {
        const config = parseOtpInput(raw);
        updateMeta(config);

        const remain = config.period - (Math.floor(Date.now() / 1000) % config.period);
        remainEl.textContent = remain;

        codeEl.textContent = await generateTOTP(config);
      } catch (err) {
        codeEl.textContent = "Lỗi";
      }
    }

    input.addEventListener("input", update);
    setInterval(update, 1000);
    update();
  </script>
</body>
</html>

<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dreamy Night — Nguyễn Hoàng Kha</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030509;color:#b9c3d7;font-family:system-ui,-apple-system,'Segoe UI',sans-serif}canvas{display:block;width:100vw;height:100vh}#start{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#182032cc;color:#d9dff1;border:1px solid #3a465e;border-radius:40px;padding:12px 22px;cursor:pointer;transition:opacity .5s}#start.hidden{opacity:0;pointer-events:none}body.playing{cursor:none}#hint{position:fixed;top:16px;left:50%;transform:translateX(-50%);color:#64718a;font-size:12px;pointer-events:none;opacity:0;transition:opacity .5s}#hint.visible{opacity:1}</style></head><body><canvas id="scene"></canvas><button id="start">⛶ Bật toàn màn hình</button><div id="hint">Nhấn Esc để thoát toàn màn hình</div><script>
(()=>{'use strict';const canvas=document.getElementById('scene'),ctx=canvas.getContext('2d',{alpha:false}),button=document.getElementById('start'),hint=document.getElementById('hint');let w=0,h=0,dpr=1,stars=[],animals=[],last=0,elapsed=0,active=false;const TAU=Math.PI*2;const rand=(a,b)=>a+Math.random()*(b-a);const colors=[['#a7a0b7','#e6a9b9'],['#b0a0c2','#e0c5df'],['#c3a58e','#e7c3ad'],['#b99d85','#e9b5a1']];function resize(){w=innerWidth;h=innerHeight;dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);stars=Array.from({length:Math.min(110,Math.floor(w*h/11000))},()=>({x:rand(0,w),y:rand(0,h),r:rand(.35,1.25),speed:rand(2,11),phase:rand(0,TAU)}));if(!animals.length)animals=Array.from({length:7},(_,i)=>({x:rand(0,w),y:rand(0,h),vx:rand(-15,15)||8,vy:rand(-10,10)||5,size:rand(33,65),type:i%4,phase:rand(0,TAU)}))}addEventListener('resize',resize);resize();function ellipse(x,y,rx,ry,color){ctx.fillStyle=color;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,TAU);ctx.fill()}function ear(x,y,rx,ry,c,inner){ellipse(x,y,rx,ry,c);ellipse(x,y,rx*.48,ry*.66,inner)}function drawAnimal(a,t){ctx.save();ctx.translate(a.x,a.y+Math.sin(t*1.15+a.phase)*10);ctx.rotate(Math.sin(t*.8+a.phase)*.10);const s=a.size/55;ctx.scale(s,s);const [fur,blush]=colors[a.type];const blink=Math.sin(t*1.7+a.phase)>0.988;const earColor='#765c7a';if(a.type===0){ear(-24,-34,12,22,fur,earColor);ear(24,-34,12,22,fur,earColor)}else if(a.type===1){ear(-18,-51,10,34,fur,blush);ear(18,-51,10,34,fur,blush)}else if(a.type===2){ear(-32,-28,15,16,fur,blush);ear(32,-28,15,16,fur,blush)}else{ctx.fillStyle=fur;ctx.beginPath();ctx.moveTo(-42,-13);ctx.lineTo(-34,-51);ctx.lineTo(-9,-32);ctx.moveTo(42,-13);ctx.lineTo(34,-51);ctx.lineTo(9,-32);ctx.fill();ear(-31,-28,12,16,fur,blush);ear(31,-28,12,16,fur,blush)}ellipse(0,0,45,38,fur);ellipse(-27,10,9,6,blush);ellipse(27,10,9,6,blush);ctx.strokeStyle='#323044';ctx.lineWidth=2.7;ctx.lineCap='round';for(const x of [-17,17]){ctx.beginPath();if(blink){ctx.moveTo(x-5,-1);ctx.lineTo(x+5,-1)}else{ctx.arc(x,-3,3.2,0,TAU)}ctx.stroke()}ellipse(0,9,3.5,2.5,'#554356');ctx.beginPath();ctx.moveTo(0,11);ctx.quadraticCurveTo(-5,17,-9,13);ctx.moveTo(0,11);ctx.quadraticCurveTo(5,17,9,13);ctx.stroke();if(a.type===0||a.type===3){ctx.strokeStyle='#665568';ctx.lineWidth=1.1;for(const side of [-1,1])for(const dy of [-3,4]){ctx.beginPath();ctx.moveTo(side*24,12+dy);ctx.lineTo(side*48,10+dy*1.7);ctx.stroke()}}ctx.restore()}
function frame(ms){const t=ms/1000,dt=Math.min((ms-last)/1000||0,.05);last=ms;elapsed+=dt;ctx.fillStyle='#030509';ctx.fillRect(0,0,w,h);const glow=ctx.createRadialGradient(w*(.5+.12*Math.sin(t*.09)),h*(.5+.15*Math.cos(t*.07)),0,w/2,h/2,Math.max(w,h)*.72);glow.addColorStop(0,'#0b1020');glow.addColorStop(1,'#030509');ctx.fillStyle=glow;ctx.fillRect(0,0,w,h);for(const star of stars){const x=(star.x+t*star.speed)%w,y=(star.y+t*star.speed*.22)%h;ctx.globalAlpha=.10+.22*(.5+.5*Math.sin(t*1.3+star.phase));ellipse(x,y,star.r,star.r,'#9caccf')}ctx.globalAlpha=1;for(const a of animals){a.x+=a.vx*dt;a.y+=a.vy*dt;if(a.x< -90)a.x=w+90;if(a.x>w+90)a.x=-90;if(a.y< -100)a.y=h+100;if(a.y>h+100)a.y=-100;drawAnimal(a,t)}ctx.save();const tx=w/2+Math.sin(t*.19)*Math.min(w*.27,230),ty=h*.73+Math.sin(t*.14)*Math.min(h*.12,75);ctx.translate(tx,ty);ctx.textAlign='center';ctx.textBaseline='middle';const fontSize=Math.max(19,Math.min(38,w/17));ctx.font=`500 ${fontSize}px system-ui, sans-serif`;ctx.globalAlpha=.45+.12*Math.sin(t*.42);ctx.fillStyle='#b6b7d3';ctx.fillText('Nguyễn Hoàng Kha',0,0);ctx.font=`${Math.max(11,fontSize*.38)}px system-ui,sans-serif`;ctx.globalAlpha=.22;ctx.fillText('☾  sweet dreams  ✦',0,fontSize*.95);ctx.restore();requestAnimationFrame(frame)}requestAnimationFrame(frame);
async function start(){try{await document.documentElement.requestFullscreen()}catch(e){console.warn('Fullscreen không khả dụng:',e)}active=true;document.body.classList.add('playing');button.classList.add('hidden');hint.classList.add('visible');setTimeout(()=>hint.classList.remove('visible'),2400)}button.addEventListener('click',start);document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement){active=false;document.body.classList.remove('playing');button.classList.remove('hidden')}});document.addEventListener('keydown',e=>{if(e.key.toLowerCase()==='f'&&!document.fullscreenElement)start()});})();
</script></body></html>

<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đàn bò gặm cỏ — Nguyễn Hoàng Kha</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#03080a;color:#b9c8c0;font-family:system-ui,'Segoe UI',sans-serif}canvas{display:block;width:100%;height:100%}#controls{position:fixed;left:18px;bottom:16px;display:flex;gap:9px;opacity:.22;transition:opacity .25s}#controls:hover{opacity:1}button{background:#14241f;color:#c6d6ca;border:1px solid #375448;border-radius:20px;padding:9px 15px;cursor:pointer}#hint{position:fixed;right:16px;bottom:20px;color:#7b9386;font-size:12px;opacity:.2;pointer-events:none}body.hidecursor{cursor:none}body.hidecursor #controls,body.hidecursor #hint{opacity:0}</style></head><body><canvas id="scene"></canvas><div id="controls"><button id="full">⛶ Toàn màn hình</button><button id="toggle">⏸ Tạm dừng</button></div><div id="hint">F: toàn màn hình · Esc: thoát · Space: tạm dừng</div><script>
(()=>{'use strict';const canvas=document.querySelector('#scene'),ctx=canvas.getContext('2d');let W=0,H=0,dpr=1,t=0,last=0,paused=false,cows=[],fireflies=[],grass=[],stars=[],mouseTimer;const rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);init()}function init(){cows=Array.from({length:Math.max(6,Math.min(13,Math.floor(W/145)))},(_,i)=>({x:(i+.4)*W/Math.max(6,Math.min(13,Math.floor(W/145))),lane:rand(.63,.89),s:rand(.65,1.2),speed:rand(3,10)*(Math.random()<.5?-1:1),phase:rand(0,7),spots:rand(0,10),grazing:Math.random()>.15}));grass=Array.from({length:Math.floor(W*1.2)},()=>({x:rand(0,W),y:rand(H*.62,H),h:rand(3,13),phase:rand(0,7)}));fireflies=Array.from({length:Math.min(65,Math.floor(W/20))},()=>({x:rand(0,W),y:rand(H*.43,H*.92),phase:rand(0,7),s:rand(.5,1.5)}));stars=Array.from({length:Math.floor(W/12)},()=>({x:rand(0,W),y:rand(0,H*.53),a:rand(.1,.42),phase:rand(0,7)}))}function ellipse(x,y,rx,ry,fill){ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fillStyle=fill;ctx.fill()}function cow(c){const y=H*c.lane,scale=c.s*Math.min(W/1050,H/650,1.35),walk=Math.sin(t*2+c.phase),headDrop=(Math.sin(t*.65+c.phase)>-.5)?12:0;ctx.save();ctx.translate(c.x+Math.sin(t*.24+c.phase)*12,y+Math.sin(t*1.6+c.phase)*1.7);ctx.scale(scale,scale);ellipse(0,7,49,8,'#02080788');ctx.strokeStyle='#8e9d91';ctx.lineWidth=4;ctx.lineCap='round';for(const x of [-24,-8,20,34]){ctx.beginPath();ctx.moveTo(x,-19);ctx.lineTo(x+walk*(x%3+1),1);ctx.stroke()}ctx.strokeStyle='#b0b7ad';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(37,-42);ctx.quadraticCurveTo(55,-35,49+Math.sin(t*3+c.phase)*7,-17);ctx.stroke();ellipse(0,-37,47,28,'#b7c1b8');ellipse(-13,-49,16,10,'#28332f');ellipse(19,-30,13,15,'#303b35');if(c.spots>5)ellipse(-33,-34,9,12,'#29362f');ctx.save();ctx.translate(-41,-42+headDrop);ctx.rotate(headDrop*.012);ellipse(-15,-12,9,6,'#a3aea4');ellipse(13,-12,9,6,'#a3aea4');ellipse(0,-12,19,19,'#cbd2c6');ellipse(-1,2,17,12,'#ae8586');ellipse(-7,3,2.5,2,'#5b5354');ellipse(6,3,2.5,2,'#5b5354');ellipse(-8,-16,2.5,2.8,'#26302b');ellipse(9,-16,2.5,2.8,'#26302b');ctx.strokeStyle='#d1c9a4';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-11,-28);ctx.lineTo(-15,-34);ctx.moveTo(10,-28);ctx.lineTo(14,-34);ctx.stroke();ctx.restore();ctx.restore()}function draw(){ctx.clearRect(0,0,W,H);const bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#030711');bg.addColorStop(.58,'#0b1a20');bg.addColorStop(1,'#06120d');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);for(const s of stars){ellipse(s.x,s.y,.65,.65,`rgba(157,186,190,${s.a*(.7+.3*Math.sin(t*.6+s.phase))})`)}ctx.fillStyle='#0b1c1c';ctx.beginPath();ctx.moveTo(0,H*.66);for(let x=0;x<=W+15;x+=15)ctx.lineTo(x,H*(.59+.045*Math.sin(x*.006+t*.015)+.023*Math.sin(x*.017)));ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill();ctx.fillStyle='#10261e';ctx.beginPath();ctx.moveTo(0,H*.74);for(let x=0;x<=W+15;x+=15)ctx.lineTo(x,H*(.69+.026*Math.sin(x*.009+t*.012)));ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill();for(const g of grass){ctx.strokeStyle='rgba(61,111,72,.26)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(g.x,g.y);ctx.quadraticCurveTo(g.x+Math.sin(t*.9+g.phase)*3,g.y-g.h*.65,g.x+Math.sin(t*.9+g.phase)*5,g.y-g.h);ctx.stroke()}for(const f of fireflies){let x=f.x+Math.sin(t*.3+f.phase)*18,y=f.y+Math.cos(t*.45+f.phase)*12;ellipse(x,y,f.s,f.s,`rgba(170,203,115,${.1+.16*(1+Math.sin(t*1.3+f.phase))/2})`)}cows.sort((a,b)=>a.lane-b.lane).forEach(c=>{c.x+=c.speed/60;if(c.x>W+80)c.x=-80;if(c.x< -80)c.x=W+80;cow(c)});const tx=W*.5+Math.sin(t*.085)*W*.18,ty=H*.2+Math.sin(t*.12)*H*.045;ctx.save();ctx.textAlign='center';ctx.textBaseline='middle';const font=Math.max(23,Math.min(56,W*.051));ctx.font=`500 ${font}px Georgia,serif`;ctx.fillStyle='rgba(174,203,182,.68)';ctx.fillText('Nguyễn Hoàng Kha',tx,ty);ctx.font=`${Math.max(12,font*.32)}px system-ui`;ctx.fillStyle='rgba(130,166,144,.4)';ctx.fillText('Đêm yên bình trên đồng cỏ',tx,ty+font*.85);ctx.restore();const shade=ctx.createRadialGradient(W/2,H*.6,H*.1,W/2,H*.5,Math.max(W,H)*.8);shade.addColorStop(0,'#00000000');shade.addColorStop(1,'#00000080');ctx.fillStyle=shade;ctx.fillRect(0,0,W,H)}function loop(now){if(!last)last=now;const dt=Math.min((now-last)/1000,.05);last=now;if(!paused){t+=dt;draw()}requestAnimationFrame(loop)}document.querySelector('#full').onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()};function toggle(){paused=!paused;document.querySelector('#toggle').textContent=paused?'▶ Tiếp tục':'⏸ Tạm dừng'}document.querySelector('#toggle').onclick=toggle;addEventListener('keydown',e=>{if(e.key.toLowerCase()==='f'){e.preventDefault();document.querySelector('#full').click()}if(e.code==='Space'){e.preventDefault();toggle()}});addEventListener('mousemove',()=>{document.body.classList.remove('hidecursor');clearTimeout(mouseTimer);mouseTimer=setTimeout(()=>document.body.classList.add('hidecursor'),2200)});addEventListener('resize',resize);resize();requestAnimationFrame(loop)})();
</script></body></html>

<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="tool-shell.css"><style>.tools{margin:16px 0}.tools .button{margin:3px}.compare{margin-top:16px}</style></head>
<body data-tool-name="Data Workbench" data-tool-category="Dữ liệu" data-tool-description="JSON formatter, validator, diff và chuyển đổi CSV, XML, YAML."><main class="shell tool-page"><section class="tool-intro" data-tool-intro></section><section class="tool-card"><div class="split-grid"><div><label class="field-label" for="input">Dữ liệu đầu vào</label><textarea id="input" placeholder="Dán JSON, CSV, XML hoặc YAML..."></textarea></div><div><label class="field-label" for="output">Kết quả</label><textarea id="output" readonly></textarea></div></div><div class="tools"><button class="button" data-a="format">JSON format</button><button class="button button-secondary" data-a="minify">JSON minify</button><button class="button button-secondary" data-a="validate">JSON validate</button><button class="button button-secondary" data-a="csvjson">CSV → JSON</button><button class="button button-secondary" data-a="jsoncsv">JSON → CSV</button><button class="button button-secondary" data-a="xml">XML format</button><button class="button button-secondary" data-a="jsonyaml">JSON → YAML</button><button class="button button-secondary" data-a="yamljson">YAML → JSON</button><button id="copy" class="button button-secondary">Sao chép</button></div><label class="field-label compare" for="compare">Văn bản thứ hai để so sánh (tùy chọn)</label><textarea id="compare" placeholder="Dán dữ liệu thứ hai rồi nhấn So sánh"></textarea><button id="diff" class="button button-secondary">So sánh dòng</button><p id="status" class="status"></p></section></main><script src="tool-shell.js"></script><script>
const i=document.querySelector('#input'),o=document.querySelector('#output'),s=document.querySelector('#status'),c=document.querySelector('#compare');
const csvRows=t=>t.trim().split(/\r?\n/).map(r=>r.split(',').map(v=>v.trim()));
function yaml(v,n=0){const pad='  '.repeat(n);if(Array.isArray(v))return v.map(x=>pad+'- '+(typeof x==='object'?'\n'+yaml(x,n+1):String(x))).join('\n');if(v&&typeof v==='object')return Object.entries(v).map(([k,x])=>pad+k+': '+(x&&typeof x==='object'?'\n'+yaml(x,n+1):String(x))).join('\n');return String(v)}
function simpleYaml(t){const r={};t.split(/\r?\n/).forEach(l=>{const m=l.match(/^([^:#]+):\s*(.*)$/);if(m)r[m[1].trim()]=m[2].trim().replace(/^['"]|['"]$/g,'')});return r}
function run(a){try{const v=i.value;if(a==='format')o.value=JSON.stringify(JSON.parse(v),null,2);if(a==='minify')o.value=JSON.stringify(JSON.parse(v));if(a==='validate'){JSON.parse(v);o.value='JSON hợp lệ.'}if(a==='csvjson'){const [h,...rows]=csvRows(v);o.value=JSON.stringify(rows.map(r=>Object.fromEntries(h.map((x,n)=>[x,r[n]||'']))),null,2)}if(a==='jsoncsv'){const d=JSON.parse(v),a=Array.isArray(d)?d:[d],h=[...new Set(a.flatMap(x=>Object.keys(x)))];o.value=[h,...a.map(x=>h.map(k=>String(x[k]??'').replaceAll('"','""')).map(x=>'"'+x+'"'))].map(r=>r.join(',')).join('\n')}if(a==='xml')o.value=v.replace(/>\s*</g,'>\n<').split('\n').reduce((z,l)=>{if(/^<\//.test(l))z.n--;z.r.push('  '.repeat(Math.max(z.n,0))+l);if(/^<[^/!?][^>]*[^/]>/ .test(l)&&!/<\/.*>$/.test(l))z.n++;return z},{n:0,r:[]}).r.join('\n');if(a==='jsonyaml')o.value=yaml(JSON.parse(v));if(a==='yamljson')o.value=JSON.stringify(simpleYaml(v),null,2);s.textContent='Đã xử lý dữ liệu.'}catch(e){s.textContent=e.message}}
document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>run(b.dataset.a));document.querySelector('#copy').onclick=async()=>{try{await navigator.clipboard.writeText(o.value);s.textContent='Đã sao chép.'}catch{}};document.querySelector('#diff').onclick=()=>{const a=i.value.split(/\r?\n/),b=c.value.split(/\r?\n/),n=Math.max(a.length,b.length);o.value=Array.from({length:n},(_,x)=>a[x]===b[x]?'  '+(a[x]||''):'- '+(a[x]||'')+'\n+ '+(b[x]||'')).join('\n');s.textContent='Đã so sánh.'};
</script></body></html>

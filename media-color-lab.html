<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="tool-shell.css"><script src="vendor/qrcode-generator.js"></script></head><body data-tool-name="Media & Color Lab" data-tool-category="Hình ảnh" data-tool-description="QR generator, chuyển đổi ảnh và đổi mã màu HEX/RGB/HSL."><main class="shell tool-page"><section class="tool-intro" data-tool-intro></section><section class="tool-card"><label class="field-label" for="text">Nội dung QR hoặc mã màu</label><input id="text" type="text" placeholder="https://example.com hoặc #6366f1"><div class="action-row"><button id="qr" class="button">Tạo QR</button><button id="color" class="button button-secondary">Đổi màu</button><input id="file" type="file" accept="image/*"><select id="format"><option value="image/png">PNG</option><option value="image/jpeg">JPG</option><option value="image/webp">WebP</option></select><button id="image" class="button button-secondary">Chuyển ảnh</button></div><p id="status" class="status"></p><div class="preview"><canvas id="canvas"></canvas></div><textarea id="output" readonly placeholder="Kết quả màu sẽ hiển thị ở đây."></textarea><div class="action-row"><button id="download" class="button button-secondary">Tải ảnh</button></div></section></main><script src="tool-shell.js"></script><script>
const t=document.querySelector('#text'),c=document.querySelector('#canvas'),x=c.getContext('2d'),s=document.querySelector('#status'),o=document.querySelector('#output'),f=document.querySelector('#file'),fmt=document.querySelector('#format');let type='image/png';document.querySelector('#qr').onclick=()=>{try{const q=qrcode(0,'M');q.addData(t.value||' ');q.make();const img=new Image();img.onload=()=>{c.width=img.width;c.height=img.height;x.drawImage(img,0,0);type='image/png';s.textContent='Đã tạo QR.'};img.src=q.createDataURL(8,0)}catch(e){s.textContent='Không thể tạo QR: '+e.message}};document.querySelector('#color').onclick=()=>{let v=t.value.trim();const q=document.createElement('div');q.style.color=v;document.body.append(q);const rgb=getComputedStyle(q).color;q.remove();const m=rgb.match(/\d+/g);if(!m)return s.textContent='Mã màu không hợp lệ.';const [r,g,b]=m.map(Number);o.value=`HEX: #${[r,g,b].map(n=>n.toString(16).padStart(2,'0')).join('').toUpperCase()}\nRGB: rgb(${r}, ${g}, ${b})`;s.textContent='Đã đổi mã màu.'};document.querySelector('#image').onclick=async()=>{const z=f.files[0];if(!z)return;s.textContent='Đang xử lý ảnh...';const b=await createImageBitmap(z);c.width=b.width;c.height=b.height;x.drawImage(b,0,0);b.close();type=fmt.value;s.textContent='Đã sẵn sàng tải ảnh.'};document.querySelector('#download').onclick=()=>c.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='output.'+type.split('/')[1];a.click()},type,.85);
</script></body></html>

<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="tool-shell.css"></head><body data-tool-name="Time & Web Workbench" data-tool-category="Chuyển đổi" data-tool-description="Unix timestamp, cron, URL parser và code formatter cơ bản."><main class="shell tool-page"><section class="tool-intro" data-tool-intro></section><section class="tool-card"><div class="split-grid"><div><label class="field-label" for="input">Timestamp, cron, URL hoặc code</label><textarea id="input"></textarea></div><div><label class="field-label" for="output">Kết quả</label><textarea id="output" readonly></textarea></div></div><div class="action-row"><button class="button" data-a="now">Timestamp hiện tại</button><button class="button button-secondary" data-a="date">Timestamp ↔ ngày</button><button class="button button-secondary" data-a="cron">Giải thích cron</button><button class="button button-secondary" data-a="url">Phân tích URL</button><button class="button button-secondary" data-a="format">Format HTML</button><button id="copy" class="button button-secondary">Sao chép</button></div><p id="status" class="status"></p></section></main><script src="tool-shell.js"></script><script>
const i=document.querySelector('#input'),o=document.querySelector('#output'),s=document.querySelector('#status');function run(a){try{if(a==='now')o.value=String(Math.floor(Date.now()/1000));if(a==='date'){const v=i.value.trim();if(/^\d+$/.test(v))o.value=new Date((v.length<=10?Number(v)*1000:Number(v))).toISOString();else o.value=String(Math.floor(new Date(v).getTime()/1000))}if(a==='cron'){const p=i.value.trim().split(/\s+/);if(p.length!==5)throw Error('Cron gồm 5 phần: phút giờ ngày-tháng tháng thứ.');o.value=`Chạy vào phút ${p[0]}, giờ ${p[1]}, ngày ${p[2]}, tháng ${p[3]}, thứ ${p[4]}.`}if(a==='url'){const u=new URL(i.value);o.value=JSON.stringify({origin:u.origin,path:u.pathname,hash:u.hash,params:Object.fromEntries(u.searchParams)},null,2)}if(a==='format'){let n=0;o.value=i.value.replace(/>\s*</g,'>\n<').split('\n').map(x=>{if(/^<\//.test(x))n--;const r='  '.repeat(Math.max(n,0))+x;if(/^<[^/!][^>]*>$/.test(x))n++;return r}).join('\n')}s.textContent='Đã xử lý.'}catch(e){s.textContent=e.message}}document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>run(b.dataset.a));document.querySelector('#copy').onclick=()=>navigator.clipboard.writeText(o.value).then(()=>s.textContent='Đã sao chép.');
</script></body></html>
